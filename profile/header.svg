<svg fill="none" viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100px;
          background: transparent;
          font-size: 35px;
          font-weight: 800;
        }

        .text-wrapper {
             display: flex; 
             align-items: center;
        }

        .static-text {
          color: #333;
        }

        @media (prefers-color-scheme: dark) {
          .static-text {
            color: #fff;
          }
        }

        .dynamic-list {
          margin-left: 10px;
          height: 50px;
          line-height: 50px;
          overflow: hidden;
        }

        .dynamic-list ul {
          margin: 0;
          padding: 0;
          list-style: none;
          animation: slide-up 6s cubic-bezier(0.23, 1, 0.32, 1) infinite;
        }

        .dynamic-list li {
            background: linear-gradient(120deg, #2564cf, #d13438);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 5px;
        }

        @keyframes slide-up {
          0%, 25% { margin-top: 0; }
          33%, 58% { margin-top: -50px; }
          66%, 91% { margin-top: -100px; }
          100% { margin-top: 0; }
        }
      </style>
      <div class="container">
        <div class="text-wrapper">
            <span class="static-text">Welcome to </span>
            <div class="dynamic-list">
            <ul>
                <li>OneIter</li>
                <li>Code Universe</li>
                <li>Innovation</li>
                <li>OneIter</li>
            </ul>
            </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
